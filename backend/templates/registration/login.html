<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión para acceder a tu panel de subsidios">
    <title>Iniciar sesión - Simulador de Subsidios para Vivienda</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'assets/css/main.css' %}">
</head>
<body>
    <header>
        <h1>Simulador de Subsidios para Vivienda</h1>
    </header>
    <main>
        <h2>Iniciar sesión</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Entrar</button>
        </form>
    </main>
    <footer>
        <p>© 2025 Simulador de Subsidios para Vivienda</p>
    </footer>
</body>
</html>

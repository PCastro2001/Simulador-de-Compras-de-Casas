<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Busca ofertas inmobiliarias según tu presupuesto">
    <title>Ofertas Inmobiliarias</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/max-value.css">
</head>
<body>
    <header>
        <h1>Ofertas Inmobiliarias</h1>
        <p>Ingresa los datos para ver links con ofertas de viviendas</p>
    </header>
    <main>
        <section class="form-container">
            <form id="offers-form">
                <div class="form-group">
                    <label for="region">Región:</label>
                    <select id="region" required>
                        <option value="" selected disabled>Selecciona región</option>
                        <option value="arica-y-parinacota">Arica y Parinacota</option>
                        <option value="tarapaca">Tarapacá</option>
                        <option value="antofagasta">Antofagasta</option>
                        <option value="atacama">Atacama</option>
                        <option value="coquimbo">Coquimbo</option>
                        <option value="valparaiso">Valparaíso</option>
                        <option value="metropolitana">Metropolitana</option>
                        <option value="bernardo-ohiggins">Bernardo O'Higgins</option>
                        <option value="maule">Maule</option>
                        <option value="biobio">Biobío</option>
                        <option value="nuble">Ñuble</option>
                        <option value="araucania">La Araucanía</option>
                        <option value="los-rios">Los Ríos</option>
                        <option value="los-lagos">Los Lagos</option>
                        <option value="aysen">Aysén</option>
                        <option value="magallanes">Magallanes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="adults">Cantidad de adultos:</label>
                    <input type="number" id="adults" min="1" required>
                </div>
                <div class="form-group">
                    <label for="children">Cantidad de niños:</label>
                    <input type="number" id="children" min="0" required>
                </div>
                <div class="form-group">
                    <label for="new-property">¿Buscar solo proyectos nuevos?</label>
                    <input type="checkbox" id="new-property">
                </div>
                <button type="submit">Generar Links</button>
            </form>
        </section>
        <section id="links-result" class="results-container"></section>
    </main>
    <footer>
        <button onclick="history.back()">Volver</button>
        <p>© 2026 SubsiMatch</p>
    </footer>
    <script src="../assets/js/real-estate-offers.js"></script>
</body>
</html>

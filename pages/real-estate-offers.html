<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Busca ofertas inmobiliarias según tu presupuesto">
    <title>Ofertas Inmobiliarias</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/max-value.css">
</head>
<body>
    <header>
        <h1>Ofertas Inmobiliarias</h1>
        <p>Ingresa los datos para ver links con ofertas de viviendas</p>
    </header>
    <main>
        <section class="form-container">
            <form id="offers-form">
                <div class="form-group">
                    <label for="adults">Cantidad de adultos:</label>
                    <input type="number" id="adults" min="1" required>
                </div>
                <div class="form-group">
                    <label for="children">Cantidad de niños:</label>
                    <input type="number" id="children" min="0" required>
                </div>
                <button type="submit">Generar Links</button>
            </form>
        </section>
        <section id="links-result" class="results-container"></section>
    </main>
    <footer>
        <button onclick="history.back()">Volver</button>
        <p>© 2025 Simulador de Subsidios para Vivienda</p>
    </footer>
    <script src="../assets/js/real-estate-offers.js"></script>
</body>
</html>
